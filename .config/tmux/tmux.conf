# -- general -------------------------------------------------------------------
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -g history-limit 10000
set -g mouse on
set -g base-index 1
set -g allow-rename off
set -g automatic-rename off
set -g pane-base-index 1
set -g renumber-windows on

# -- prefix --------------------------------------------------------------------
unbind C-b
set -g prefix C-s
bind C-s send-prefix

# -- keybindings ---------------------------------------------------------------
bind r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded!"
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# -- copy mode -----------------------------------------------------------------
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-pipe-and-cancel

# -- plugins -------------------------------------------------------------------
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'tmux-plugins/tmux-battery'
set -g @plugin 'catppuccin/tmux#v2.3.0'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-yank'

# stop tmux-yank from installing its own mouse binding (it clears the selection)
set -g @yank_with_mouse off

# -- catppuccin ----------------------------------------------------------------
set -g @catppuccin_flavor 'macchiato'
set -g @catppuccin_window_status_style "rounded"
set -g @catppuccin_window_text "#W"
set -g @catppuccin_window_current_text "#W"

run '~/.config/tmux/plugins/catppuccin/tmux/catppuccin.tmux'

# more visible selection colour (macchiato surface2 / text)
set -g mode-style "bg=#5b6078,fg=#cad3f5"

# -- status bar ----------------------------------------------------------------
set -g status-right-length 100
set -g status-left-length 100
set -g status-left ""
set -g status-right "#{E:@catppuccin_status_application}"
set -agF status-right "#{E:@catppuccin_status_cpu}"
set -agF status-right "#{E:@catppuccin_status_ram}"
set -ag status-right "#{E:@catppuccin_status_session}"
set -ag status-right "#{E:@catppuccin_status_uptime}"
set -agF status-right "#{E:@catppuccin_status_battery}"

run '~/.config/tmux/plugins/tmux-cpu/cpu.tmux'

# -- tpm -----------------------------------------------------------------------
run '~/.config/tmux/plugins/tpm/tpm'

# -- mouse selection (after tpm so no plugin can override it) -----------------
# copy on mouse release but keep the text highlighted; press q or Esc to exit
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-no-clear
bind -T copy-mode MouseDragEnd1Pane send -X copy-pipe-no-clear
